# Batch 1 CI Pipeline — NFM-854
# Triggers on changes to backend code, scripts, schemas, and CI config.
name: batch1-ci

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/**"
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/batch1-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/**"
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/batch1-ci.yml"

concurrency:
  group: batch1-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff check
        run: ruff check nfm_backend/ tests/

      - name: Run ruff format check
        run: ruff format --check nfm_backend/ tests/

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]" mypy

      - name: Run mypy
        run: mypy nfm_backend/ --ignore-missing-imports --no-error-summary 2>&1 || true
        # Non-blocking until type annotations are complete

  unit-tests:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests with coverage
        run: |
          pytest tests/ \
            --cov=nfm_backend \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --cov-fail-under=80 \
            -v

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.json

  extraction-accuracy:
    name: Extraction Accuracy (>=60%)
    runs-on: ubuntu-latest
    needs: [lint]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e backend/".[dev]"

      - name: Run extraction accuracy evaluation
        run: |
          python scripts/eval_extraction_accuracy.py \
            --fixtures-dir backend/tests/fixtures/extraction \
            --min-accuracy 60.0 \
            --output-json accuracy_report.json

      - name: Upload accuracy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-report
          path: accuracy_report.json

  schema-compat:
    name: Schema Compatibility Check
    runs-on: ubuntu-latest
    needs: [lint]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run schema compatibility check
        run: |
          python scripts/check_schema_compat.py \
            --schemas-dir backend/nfm_backend/schemas \
            --baseline-dir schemas/.compat-baseline \
            --fail-on-breaking

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, extraction-accuracy, schema-compat]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "extraction-accuracy: ${{ needs.extraction-accuracy.result }}"
          echo "schema-compat: ${{ needs.schema-compat.result }}"

          if [[ "${{ needs.lint.result }}" == "failure" ]] \
             || [[ "${{ needs.unit-tests.result }}" == "failure" ]] \
             || [[ "${{ needs.extraction-accuracy.result }}" == "failure" ]] \
             || [[ "${{ needs.schema-compat.result }}" == "failure" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi

          echo "All CI jobs passed!"
